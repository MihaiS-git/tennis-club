# Dedicated disposable test stack. Never link this project to a remote project.
project_id = "tennis-club-tests"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false
port = 55329

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/account&flow=email-confirmation", "http://localhost:3000/auth/callback?next=/reset-password"]
jwt_secret = "disposable-tennis-club-tests-jwt-secret-only"
enable_signup = true

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

[realtime]
enabled = false

[edge_runtime]
enabled = false
inspector_port = 8084

[analytics]
enabled = false
port = 55327
